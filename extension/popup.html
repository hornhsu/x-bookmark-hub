<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>X Bookmark Hub</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background: #11141c;
      color: #eef1f7;
      font-size: 13px;
    }
    h1 { margin: 0 0 4px; font-size: 15px; }
    .sub { color: #94a0b8; font-size: 11.5px; margin-bottom: 12px; }
    label { display: block; margin: 8px 0 4px; color: #c4ccdc; font-size: 12px; }
    input, select {
      width: 100%;
      box-sizing: border-box;
      background: #1b202c;
      color: #eef1f7;
      border: 1px solid #2d3447;
      border-radius: 7px;
      padding: 7px 9px;
      font-size: 12.5px;
    }
    .row { display: flex; gap: 8px; margin-top: 12px; }
    button {
      flex: 1;
      padding: 8px 10px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 12.5px;
    }
    #startBtn { background: #4f7cff; color: #fff; }
    #startBtn:disabled { opacity: 0.55; cursor: not-allowed; }
    #stopBtn { background: #2a3040; color: #eef1f7; }
    #stopBtn:disabled { opacity: 0.45; cursor: not-allowed; }
    #status {
      margin-top: 12px;
      padding: 9px 10px;
      border-radius: 8px;
      background: #1a1f2b;
      border: 1px solid #2b3245;
      color: #cdd5e5;
      white-space: pre-line;
      min-height: 36px;
      font-size: 12px;
      line-height: 1.45;
    }
    #status.ok { border-color: #2f9e44; color: #b2f2bb; }
    #status.err { border-color: #e03131; color: #ffc9c9; }
    .links { margin-top: 10px; display: flex; justify-content: space-between; font-size: 11.5px; }
    a { color: #7da2ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>X Bookmark Hub</h1>
  <div class="sub">支援 x.com/i/history 與增量同步</div>

  <label for="serverUrl">本機 Server 位址</label>
  <input id="serverUrl" type="text" value="http://127.0.0.1:7799" />

  <label for="modeSelect">同步模式</label>
  <select id="modeSelect">
    <option value="incremental">增量同步（遇已知貼文自動停止）</option>
    <option value="full">全量掃描（捲動至底，補齊所有書籤）</option>
  </select>

  <label for="thresholdInput">增量停止門檻（連續已知則數）</label>
  <input id="thresholdInput" type="number" min="3" max="100" value="15" />

  <div class="row">
    <button id="startBtn" type="button">開始同步</button>
    <button id="stopBtn" type="button" disabled>停止</button>
  </div>

  <div id="status">請先開啟並登入 x.com/i/bookmarks 或 x.com/i/history</div>

  <div class="links">
    <a id="openUiLink" href="http://127.0.0.1:7799" target="_blank">開啟 Web 管理介面 ↗</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
